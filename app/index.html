<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' file:; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data:; media-src 'self' file: ext:; connect-src 'self' file:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Home</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="clock.css" />
    <link rel="stylesheet" href="item-options.css" />
    <link rel="stylesheet" href="date-time-settings.css" />
    <link rel="stylesheet" href="screensaver.css" />
    <link rel="stylesheet" href="browser-compat.css" />
  </head>
  <body>
    <img id="wallpaper" class="wallpaper" alt="" aria-hidden="true" hidden />
    <canvas id="wave" aria-hidden="true"></canvas>
    <div class="ambient" aria-hidden="true"></div>
    <div id="screensaverDim" aria-hidden="true"></div>
    <div class="screen" id="screen">
      <header>
        <div class="clock" data-style="current">
          <time id="time"></time><span id="date"></span>
          <svg class="clock-face" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
            <circle cx="16" cy="16" r="13" />
            <path class="clock-hour" d="M16 16V9" />
            <path class="clock-minute" d="M16 16V6" />
          </svg>
        </div>
      </header>
      <main aria-label="TV launcher">
        <nav id="categories" aria-label="Categories"></nav>
        <section class="cross-content">
          <div id="items" role="listbox" aria-label="TV" tabindex="0"></div>
          <aside class="detail" aria-labelledby="detailTitle">
            <div class="detail-eyebrow" id="detailType">TV</div>
            <div class="detail-emblem" id="detailEmblem" aria-hidden="true"></div>
            <div class="preview-panel" id="previewPanel" hidden>
              <img id="inputThumbnail" class="input-thumbnail" alt="" draggable="false" hidden />
              <div id="thumbnailFallback" class="thumbnail-fallback" aria-hidden="true">
                <span class="thumbnail-symbol"></span>
              </div>
              <div class="input-preview" id="inputPreview" aria-hidden="true" hidden>
                <div class="input-preview-media"></div>
                <div class="input-preview-placeholder">
                  <span class="input-preview-symbol"></span
                  ><span class="input-preview-message"></span>
                </div>
              </div>
              <button
                id="previewButton"
                class="preview-button"
                type="button"
                aria-label="Open HDMI input full-screen"
              ></button>
            </div>
            <h1 id="detailTitle">Live TV</h1>
            <p id="detailDescription">Watch television channels.</p>
          </aside>
        </section>
      </main>
      <div class="selection-live sr-only" aria-live="polite" id="selectionLive"></div>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="modalBackdrop" class="modal-backdrop" hidden>
      <section
        class="modal"
        id="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
        tabindex="-1"
      >
        <h2 id="modalTitle">Appearance</h2>
        <p class="modal-intro" id="modalIntro"></p>
        <div id="modalContent"></div>
      </section>
    </div>
    <script src="browser-compat.js"></script>
    <script src="user-fonts.js"></script>
    <script src="icons.js"></script>
    <script src="catalog.js"></script>
    <script src="tv-bridge.js"></script>
    <script src="helper.js"></script>
    <script src="menu-focus.js"></script>
    <script src="directional-repeat.js"></script>
    <script src="wheel-navigation.js"></script>
    <script src="remote-settings.js"></script>
    <script src="wave-colors.js"></script>
    <script src="wave-color-settings.js"></script>
    <script src="ps3-native-data.js"></script>
    <script src="ps3-background-data.js"></script>
    <script src="ps3-background-clock.js"></script>
    <script src="ps3-particle-birth.js"></script>
    <script src="ps3-native-core.js"></script>
    <script src="ps3-native-shaders.js"></script>
    <script src="ps3-native-renderer.js"></script>
    <script src="input-preview.js"></script>
    <script src="thumbnail.js"></script>
    <script src="background-music.js"></script>
    <script src="menu-sounds.js"></script>
    <script src="category-transition.js"></script>
    <script src="app-manager.js"></script>
    <script src="hold-gesture.js"></script>
    <script src="menu-order.js"></script>
    <script src="app-categories.js"></script>
    <script src="app-refresh.js"></script>
    <script src="item-options.js"></script>
    <script src="system-time.js"></script>
    <script src="date-time-settings.js"></script>
    <!-- Controller dependencies: model/configuration, views, then app wiring. -->
    <script src="launcher-preferences.js"></script>
    <script src="settings-ui.js"></script>
    <script src="appearance-settings.js"></script>
    <script src="wallpaper.js"></script>
    <script src="screensaver.js"></script>
    <script src="screensaver-view.js"></script>
    <script src="launcher-view.js"></script>
    <script src="clock-view.js"></script>
    <script src="app.js"></script>
  </body>
</html>
