name: Helper integration validation
on:
  push:
    branches: [work/lg-xmb-bundled-helper]
permissions:
  contents: write
concurrency:
  group: lg-xmb-helper-integration
  cancel-in-progress: true
jobs:
  integration:
    if: github.repository == 'Ripthulhu/LG-XMB'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Prepare isolated source tree
        run: |
          python3 .maintenance/apply.py
          rm -rf .maintenance
          rm .github/workflows/helper-integration.yml
          git diff --check
          git diff --stat
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Unit and clean-install tests
        run: |
          npm test
          python3 -B -m unittest discover -s tests -p 'test_*.py'
          python3 -B -m unittest discover -s tv-helper -p 'test_*.py'
          python3 -B -m unittest discover -s tv-helper/recovery -p 'test_*.py'
      - run: npx playwright install --with-deps chromium msedge
      - name: Browser tests
        shell: bash
        run: |
          node tools/preview.cjs > "$RUNNER_TEMP/preview.log" 2>&1 &
          preview=$!
          trap 'kill "$preview" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          npm run test:compat
          npm run test:browser
          node tests/wave-retention-browser.cjs
      - name: Verify self-contained IPK
        run: |
          npm run package
          npm run verify:package
          python3 tools/verify-helper-package.py dist/org.local.openxmb.c5_0.1.12_all.ipk
      - name: Save validated source on the temporary branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Validate bundled lg-xmb helper setup and XMB upper icons'
          git push origin HEAD:refs/heads/work/lg-xmb-bundled-helper
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
