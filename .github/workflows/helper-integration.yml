name: Helper integration validation
on:
  push:
    branches: [work/lg-xmb-bundled-helper]
permissions:
  contents: read
concurrency:
  group: lg-xmb-helper-integration
  cancel-in-progress: true
jobs:
  integration:
    if: github.repository == 'Ripthulhu/LG-XMB'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Prepare isolated source tree
        run: |
          python3 .maintenance/apply.py
          python3 .maintenance/post.py
          rm -rf .maintenance
          rm .github/workflows/helper-integration.yml
          git diff --check
          git diff --stat
      - run: npm ci --ignore-scripts --no-audit --no-fund > "$RUNNER_TEMP/npm.log" 2>&1 || { tail -60 "$RUNNER_TEMP/npm.log"; exit 1; }
      - name: Unit and clean-install tests
        run: |
          npm test > "$RUNNER_TEMP/node-tests.log" 2>&1 || { tail -100 "$RUNNER_TEMP/node-tests.log"; exit 1; }
          tail -8 "$RUNNER_TEMP/node-tests.log"
          python3 -B -m unittest discover -s tests -p 'test_*.py'
          python3 -B -m unittest discover -s tv-helper -p 'test_*.py'
          python3 -B -m unittest discover -s tv-helper/recovery -p 'test_*.py'
      - run: npx playwright install --with-deps chromium msedge > "$RUNNER_TEMP/browser-install.log" 2>&1 || { tail -60 "$RUNNER_TEMP/browser-install.log"; exit 1; }
      - name: Browser tests
        shell: bash
        run: |
          node tools/preview.cjs > "$RUNNER_TEMP/preview.log" 2>&1 &
          preview=$!
          trap 'kill "$preview" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          npm run test:compat
          npm run test:browser
          node tests/wave-retention-browser.cjs
      - name: Verify self-contained IPK
        run: |
          npm run package
          npm run verify:package
          python3 tools/verify-helper-package.py dist/org.local.openxmb.c5_0.1.12_all.ipk
      - name: Archive validated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Validate bundled lg-xmb helper setup and XMB upper icons'
          git rev-parse HEAD > dist/validated-commit.txt
          git rev-parse HEAD^{tree} > dist/validated-tree.txt
          git archive --format=zip --output=dist/source.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lg-xmb-integration-source
          path: dist/
          if-no-files-found: error
          retention-days: 14
