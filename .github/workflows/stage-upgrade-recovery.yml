name: Stage verified helper upgrade fix
on:
  push:
    branches: [fix/helper-upgrade-owner]
permissions:
  contents: write
jobs:
  stage:
    if: github.event.created == true && github.repository == 'Ripthulhu/LG-XMB'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Apply exact locally tested changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 78bb35d00bdc8368c00d6ca3fb39443ca7605963
          python3 - <<'PY'
          import base64, gzip, hashlib, subprocess, re
          from pathlib import Path
          data = ''.join(Path('.github/upgrade-recovery.' + str(i)).read_text() for i in range(4))
          patch = gzip.decompress(base64.b64decode(data, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '5119a20938230505f3eb4485aec51b58400455c9dcba91c3316e12bfe5442751'
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          for name in ['package.json', 'package-lock.json', 'app/appinfo.json', 'app/app.js', 'tools/package.mjs', 'tools/browser-check.cjs']:
              path = Path(name)
              text = path.read_text()
              assert '0.1.14' in text
              path.write_text(text.replace('0.1.14', '0.1.15'))
          path = Path('tv-helper/process_control.py')
          pin = hashlib.sha256(Path('app/appinfo.json').read_bytes()).hexdigest()
          text, count = re.subn(r"PIN_APPINFO_SHA256 = '[0-9a-f]{64}'", "PIN_APPINFO_SHA256 = '" + pin + "'", path.read_text())
          assert count == 1
          path.write_text(text)
          PY
          git rm -- .github/upgrade-recovery.0 .github/upgrade-recovery.1 .github/upgrade-recovery.2 .github/upgrade-recovery.3 .github/workflows/stage-upgrade-recovery.yml
          git add -- app package.json package-lock.json tests tools tv-helper/process_control.py docs/releases/0.1.15.md
          test "$(git write-tree)" = f71b0ce6fccbaa907d96456c7bdfdc4da475d27b
          npm test
          python3 -B -m unittest discover -s tests -p 'test_*.py'
          python3 -B -m unittest discover -s tv-helper -p 'test_*.py'
          python3 -B -m unittest discover -s tv-helper/recovery -p 'test_*.py'
      - name: Publish only the verified source tree to this work branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/helper-upgrade-owner
          test "$(git write-tree)" = f71b0ce6fccbaa907d96456c7bdfdc4da475d27b
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config credential.helper '!gh auth git-credential'
          git -c core.hooksPath=/dev/null commit -m 'Recover the verified legacy helper directory on upgrade (0.1.15)'
          git push origin HEAD:refs/heads/fix/helper-upgrade-owner
